<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>SONAR ROOM SCANNER V6</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #0a0e27;
            color: #00ff88;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }

        #app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            padding: max(env(safe-area-inset-top), 8px) max(env(safe-area-inset-right), 8px) max(env(safe-area-inset-bottom), 8px) max(env(safe-area-inset-left), 8px);
            gap: 8px;
        }

        #header {
            text-align: center;
            padding: 8px 0;
            border-bottom: 2px solid #00ff88;
        }

        #header h1 {
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }

        #header p {
            font-size: 11px;
            opacity: 0.7;
            margin: 0;
        }

        #status-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 12px;
        }

        .status-box, .stat-box {
            background: rgba(0, 255, 136, 0.05);
            border: 1px solid #00ff88;
            padding: 8px;
            border-radius: 4px;
            text-align: center;
        }

        .status-label {
            font-size: 10px;
            opacity: 0.6;
            margin-bottom: 2px;
        }

        .status-value {
            font-size: 14px;
            font-weight: bold;
            color: #00ff88;
        }

        .stat-box .stat-value {
            font-size: 16px;
            font-weight: bold;
            color: #00ff88;
        }

        .stat-box .stat-label {
            font-size: 9px;
            opacity: 0.6;
            margin-top: 2px;
        }

        #radar-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 255, 136, 0.02);
            border: 1px solid #00ff88;
            border-radius: 4px;
            min-height: 200px;
            overflow: hidden;
        }

        #radar-canvas {
            max-width: 100%;
            max-height: 100%;
        }

        #error-message {
            background: #ff3333;
            color: #ffffff;
            padding: 8px;
            border-radius: 4px;
            font-size: 12px;
            display: none;
            text-align: center;
            border: 1px solid #ff6666;
        }

        #error-message.show {
            display: block;
        }

        #disclaimer {
            background: rgba(255, 153, 0, 0.1);
            border: 1px solid #ff9900;
            padding: 6px;
            border-radius: 4px;
            font-size: 10px;
            line-height: 1.4;
            color: #ffcc00;
        }

        #controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        button {
            background: #00ff88;
            color: #0a0e27;
            border: none;
            padding: 12px 8px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:active {
            background: #00cc66;
            transform: scale(0.98);
        }

        button:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
            opacity: 0.5;
        }

        .status-light {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 4px;
            vertical-align: middle;
        }

        .status-light.ready {
            background: #ffff00;
            box-shadow: 0 0 8px #ffff00;
        }

        .status-light.requesting {
            background: #ffaa00;
            box-shadow: 0 0 8px #ffaa00;
            animation: pulse 1s infinite;
        }

        .status-light.active {
            background: #00ff88;
            box-shadow: 0 0 8px #00ff88;
        }

        .status-light.error {
            background: #ff3333;
            box-shadow: 0 0 8px #ff3333;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @media (max-width: 375px) {
            #header h1 { font-size: 16px; }
            button { font-size: 12px; padding: 10px 6px; }
        }
    </style>
</head>
<body>
    <div id="app-container">
        <div id="header">
            <h1>🔊 SONAR ROOM SCANNER V6</h1>
            <p>시뮬레이션 모드 - 방향 센서</p>
        </div>

        <div id="error-message"></div>

        <div id="status-stats">
            <div class="status-box">
                <div class="status-label">상태</div>
                <div class="status-value">
                    <span class="status-light ready"></span><span id="status-text">준비</span>
                </div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="audio-level">0%</div>
                <div class="stat-label">신호 강도</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="direction-value">--°</div>
                <div class="stat-label">현재 방향</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="point-count">0</div>
                <div class="stat-label">측정점</div>
            </div>
        </div>

        <div id="radar-container">
            <canvas id="radar-canvas"></canvas>
        </div>

        <div id="disclaimer">
            ⚠️ 시뮬레이션 모드: 방향 센서와 무작위 신호로 작동합니다.
        </div>

        <div id="controls">
            <button id="btn-start">🎙 측정 시작</button>
            <button id="btn-test">🔊 신호 생성</button>
            <button id="btn-reset">↻ 초기화</button>
            <button id="btn-stop">■ 정지</button>
        </div>
    </div>

    <script>
        class SonarRoomScanner {
            constructor() {
                this.isRunning = false;
                this.currentDirection = null;
                this.radarPoints = [];
                this.lastUpdateTime = 0;
                this.measurementRAFId = null;
                this.simulationLevel = 0;

                // DOM elements
                this.canvas = document.getElementById('radar-canvas');
                this.ctx = this.canvas ? this.canvas.getContext('2d') : null;
                this.btnStart = document.getElementById('btn-start');
                this.btnTest = document.getElementById('btn-test');
                this.btnReset = document.getElementById('btn-reset');
                this.btnStop = document.getElementById('btn-stop');
                this.statusText = document.getElementById('status-text');
                this.statusLight = document.querySelector('.status-light');
                this.audioLevel = document.getElementById('audio-level');
                this.directionValue = document.getElementById('direction-value');
                this.pointCount = document.getElementById('point-count');
                this.errorMessage = document.getElementById('error-message');

                if (!this.canvas || !this.ctx) {
                    console.error('Canvas not found');
                    return;
                }

                this.btnStart.addEventListener('click', () => this.startMeasurement());
                this.btnTest.addEventListener('click', () => this.generateTestSignal());
                this.btnReset.addEventListener('click', () => this.reset());
                this.btnStop.addEventListener('click', () => this.stop());

                window.addEventListener('resize', () => this.resizeCanvas());
                window.addEventListener('deviceorientation', (e) => this.handleDeviceOrientation(e));

                this.resizeCanvas();
                this.updateStatus('준비', 'ready');
                this.updateButtonStates();
                console.log('✓ SONAR initialized (simulation mode)');
            }

            updateStatus(text, lightClass) {
                if (this.statusText) this.statusText.textContent = text;
                if (this.statusLight) this.statusLight.className = 'status-light ' + lightClass;
            }

            updateButtonStates() {
                if (this.btnStart) this.btnStart.disabled = this.isRunning;
                if (this.btnStop) this.btnStop.disabled = !this.isRunning;
                if (this.btnReset) this.btnReset.disabled = this.radarPoints.length === 0;
            }

            handleDeviceOrientation(event) {
                let heading = null;

                if (event.webkitCompassHeading !== undefined && event.webkitCompassHeading !== null) {
                    heading = event.webkitCompassHeading;
                } else if (event.alpha !== undefined) {
                    heading = event.alpha;
                }

                if (heading !== null && typeof heading === 'number') {
                    heading = Math.round(heading) % 360;
                    this.currentDirection = heading;
                    if (this.directionValue) {
                        this.directionValue.textContent = heading + '°';
                    }
                }
            }

            async requestDeviceOrientationPermission() {
                if (typeof DeviceOrientationEvent === 'undefined') return true;
                if (typeof DeviceOrientationEvent.requestPermission !== 'function') return true;

                this.updateStatus('방향 센서 권한 요청', 'requesting');
                try {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    if (permission === 'granted') {
                        console.log('✓ Device orientation permission granted');
                        return true;
                    }
                    return false;
                } catch (error) {
                    console.error('Device orientation error:', error.message);
                    return false;
                }
            }

            generateTestSignal() {
                this.simulationLevel = Math.min(100, this.simulationLevel + 20);
                console.log('✓ Test signal generated, level:', this.simulationLevel);
            }

            startMeasurement() {
                this.isRunning = true;
                this.updateStatus('측정 중', 'active');
                this.updateButtonStates();
                this.requestDeviceOrientationPermission();
                this.measurementLoop();
            }

            measurementLoop() {
                if (!this.isRunning) return;

                const now = performance.now();

                // Simulate audio level with decay
                this.simulationLevel = Math.max(0, this.simulationLevel - 2);
                if (Math.random() < 0.1) {
                    this.simulationLevel = Math.min(100, this.simulationLevel + Math.random() * 30);
                }

                const level = Math.round(this.simulationLevel);

                if (this.audioLevel) {
                    this.audioLevel.textContent = level + '%';
                }

                if (this.currentDirection !== null && now - this.lastUpdateTime > 100) {
                    this.radarPoints.push({
                        direction: this.currentDirection,
                        level: level,
                        timestamp: now
                    });
                    if (this.pointCount) {
                        this.pointCount.textContent = this.radarPoints.length;
                    }
                    this.lastUpdateTime = now;
                }

                this.drawRadar();
                this.measurementRAFId = requestAnimationFrame(() => this.measurementLoop());
            }

            resizeCanvas() {
                if (!this.canvas) return;

                const container = document.getElementById('radar-container');
                if (!container) return;

                const size = Math.min(container.clientWidth, container.clientHeight) - 20;

                this.canvas.width = size;
                this.canvas.height = size;
                this.radius = size / 2 - 20;
                this.centerX = size / 2;
                this.centerY = size / 2;
            }

            drawRadar() {
                if (!this.ctx || !this.canvas) return;

                try {
                    this.ctx.fillStyle = 'rgba(10, 14, 39, 0.8)';
                    this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                    if (!this.radius || this.radius <= 0) return;

                    // Grid circles
                    this.ctx.strokeStyle = 'rgba(0, 255, 136, 0.2)';
                    this.ctx.lineWidth = 1;
                    for (let i = 1; i <= 4; i++) {
                        const r = (this.radius / 4) * i;
                        this.ctx.beginPath();
                        this.ctx.arc(this.centerX, this.centerY, r, 0, Math.PI * 2);
                        this.ctx.stroke();
                    }

                    // Cardinal directions
                    this.ctx.fillStyle = 'rgba(0, 255, 136, 0.4)';
                    this.ctx.font = 'bold 12px Courier New';
                    this.ctx.textAlign = 'center';
                    this.ctx.textBaseline = 'middle';

                    const directions = [
                        { label: 'N', angle: 0 },
                        { label: 'E', angle: 90 },
                        { label: 'S', angle: 180 },
                        { label: 'W', angle: 270 }
                    ];

                    directions.forEach(d => {
                        const rad = (d.angle - 90) * Math.PI / 180;
                        const x = this.centerX + Math.cos(rad) * (this.radius + 15);
                        const y = this.centerY + Math.sin(rad) * (this.radius + 15);
                        this.ctx.fillText(d.label, x, y);
                    });

                    // Axis lines
                    this.ctx.strokeStyle = 'rgba(0, 255, 136, 0.2)';
                    this.ctx.lineWidth = 1;
                    this.ctx.beginPath();
                    this.ctx.moveTo(this.centerX, this.centerY - this.radius);
                    this.ctx.lineTo(this.centerX, this.centerY + this.radius);
                    this.ctx.stroke();

                    this.ctx.beginPath();
                    this.ctx.moveTo(this.centerX - this.radius, this.centerY);
                    this.ctx.lineTo(this.centerX + this.radius, this.centerY);
                    this.ctx.stroke();

                    // Measurement points
                    this.radarPoints.forEach(point => {
                        const angle = (point.direction - 90) * Math.PI / 180;
                        const distance = (point.level / 100) * this.radius;
                        const x = this.centerX + Math.cos(angle) * distance;
                        const y = this.centerY + Math.sin(angle) * distance;

                        const hue = point.level * 1.2;
                        this.ctx.fillStyle = `hsl(${hue}, 100%, 50%)`;
                        this.ctx.beginPath();
                        this.ctx.arc(x, y, 3, 0, Math.PI * 2);
                        this.ctx.fill();
                    });

                    // Direction indicator
                    if (this.currentDirection !== null) {
                        const angle = (this.currentDirection - 90) * Math.PI / 180;
                        const endX = this.centerX + Math.cos(angle) * this.radius;
                        const endY = this.centerY + Math.sin(angle) * this.radius;

                        this.ctx.strokeStyle = '#00ff88';
                        this.ctx.lineWidth = 2;
                        this.ctx.beginPath();
                        this.ctx.moveTo(this.centerX, this.centerY);
                        this.ctx.lineTo(endX, endY);
                        this.ctx.stroke();

                        // Arrow
                        const arrowSize = 8;
                        const arrowAngle1 = angle + Math.PI / 6;
                        const arrowAngle2 = angle - Math.PI / 6;
                        const ax1 = endX + Math.cos(arrowAngle1) * arrowSize;
                        const ay1 = endY + Math.sin(arrowAngle1) * arrowSize;
                        const ax2 = endX + Math.cos(arrowAngle2) * arrowSize;
                        const ay2 = endY + Math.sin(arrowAngle2) * arrowSize;

                        this.ctx.beginPath();
                        this.ctx.moveTo(endX, endY);
                        this.ctx.lineTo(ax1, ay1);
                        this.ctx.lineTo(ax2, ay2);
                        this.ctx.closePath();
                        this.ctx.fillStyle = '#00ff88';
                        this.ctx.fill();
                    }
                } catch (e) {
                    console.error('Canvas drawing error:', e.message);
                }
            }

            stop() {
                this.isRunning = false;
                if (this.measurementRAFId) {
                    cancelAnimationFrame(this.measurementRAFId);
                }
                this.updateStatus('정지', 'ready');
                this.updateButtonStates();
            }

            reset() {
                this.radarPoints = [];
                this.simulationLevel = 0;
                if (this.pointCount) this.pointCount.textContent = '0';
                if (this.audioLevel) this.audioLevel.textContent = '0%';
                if (this.directionValue) this.directionValue.textContent = '--°';
                this.currentDirection = null;
                this.updateButtonStates();
                this.drawRadar();
            }

            cleanup() {
                this.isRunning = false;
                if (this.measurementRAFId) {
                    cancelAnimationFrame(this.measurementRAFId);
                }
            }
        }

        let sonarApp = null;

        document.addEventListener('DOMContentLoaded', () => {
            try {
                sonarApp = new SonarRoomScanner();
            } catch (e) {
                console.error('Init error:', e.message);
            }
        });

        window.addEventListener('beforeunload', () => {
            if (sonarApp) {
                sonarApp.cleanup();
            }
        });
    </script>
</body>
</html>
